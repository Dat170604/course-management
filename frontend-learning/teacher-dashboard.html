<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="css/teacher-dashboard.css">
</head>
<body>
    <header>
        <a href="teacher-dashboard.html" id="logo">Teacher Dashboard</a>
        <div id="tools">
            <button id="create-course">Create Courses</button>
            <button id="logout">Logout</button>
        </div>
    </header>
    <main>
        <h2>My Courses</h2>

        <div id="search">
            <input id="search-input"
            type="text"
            placeholder="Search">

            <button id="search-button">Search</button>
        </div>
        <div id="course-list"></div>

        <p id="message"></p>

        <div id="pagination">

            <button id="prev-page">
                Previous
            </button>

            <span id="page-info">
                Page 1
            </span>

            <button id="next-page">
                Next
            </button>

        </div>
    </main>

    <div id="edit-modal" class="modal" hidden>
        <div class="modal-content">
            <button id="close-modal">X</button>
            <h2>Edit Course</h2>
            <form id="edit-course-form">
                <label>Title</label>

                <input
                    id="edit-title"
                    type="text"
                    required
                >

                <label>Description</label>

                <textarea
                    id="edit-description"
                    required
                ></textarea>

                <label>Price</label>

                <input
                    id="edit-price"
                    type="number"
                    required
                >

                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <div id="delete-modal" class="modal" hidden>
        <div class="modal-content">
            <h2>Delete Course</h2>
            <p>Are you sure you want to delete this course?</p>
            <button
                id="confirm-delete"
                type="button">
                Delete
            </button>

            <button
                id="cancel-delete"
                type="button">
                Cancel
            </button>
        </div>
    </div>



    <div id="toast-container"></div>

    <script type="module" src="js/teacher-dashboard.js"></script>
</body>
</html>
