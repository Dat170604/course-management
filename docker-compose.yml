services:

  backend:
    build: .
    container_name: course_backend

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_HOST: redis

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: course_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD }
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pdat170604"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mysql_data: