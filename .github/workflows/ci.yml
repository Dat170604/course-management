name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: course_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7

        ports:
          - 6379:6379

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: course_test

      REDIS_HOST: localhost

      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAY: "7"

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        working-directory: backend
        run: |
          pytest --cov=app --cov-branch --cov-fail-under=70

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/course-management:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/course-management:latest \
          ./backend
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/course-management:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/course-management:latest
